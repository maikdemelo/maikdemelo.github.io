<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Ambiente de testes de projetos de Maik de Melo." />
  <title>Laboratório de Projetos | Maik de Melo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 15% 20%, #193866, transparent 40%), #0b1220; color: #f6f8ff; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 720px); border: 1px solid #334155; border-radius: 22px; padding: clamp(28px, 7vw, 64px); background: #0f172ac9; box-shadow: 0 24px 70px #02061788; }
    .tag { display: inline-block; padding: 8px 12px; background: #164e63; border: 1px solid #0e7490; border-radius: 999px; color: #a5f3fc; font-size: .84rem; font-weight: 650; letter-spacing: .02em; }
    h1 { font-size: clamp(2rem, 6vw, 3.8rem); line-height: 1.08; letter-spacing: -.04em; margin: 26px 0 18px; }
    p { color: #cbd5e1; line-height: 1.75; font-size: 1.08rem; margin-bottom: 32px; }
    .status { display: flex; align-items: center; gap: 10px; color: #86efac; font-weight: 600; border-top: 1px solid #334155; padding-top: 24px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 15px #4ade80aa; }
    footer { margin-top: 32px; color: #94a3b8; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <span class="tag">GitHub Pages • Ambiente de testes</span>
    <h1>Projetos em construção.</h1>
    <p>Este espaço será usado para publicar, visualizar e validar protótipos antes da migração para a plataforma definitiva.</p>
    <div class="status"><span class="dot"></span> Página inicial preparada para publicação</div>
    <footer>Maik de Melo · Laboratório de projetos</footer>
  </main>
</body>
</html>
